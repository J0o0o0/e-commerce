
<div class="page-layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <button class="clear-btn" (click)="clearCategory()">
      Clear Filters
    </button>

    <div class="filter-section">
      <h3 class="category-item">Categories</h3>
      <div class="category-item"
           *ngFor="let cat of categories"
           (click)="onCategorySelect(cat.id)"
           [class.active]="selectedCategoryId === cat.id">

        <span>{{ cat.name }}</span>

      </div>
    </div>


    <div class="filter-section">
      <h3>Price</h3>
      <div class="price-filter">

        <div class="price-inputs">
          <input type="number"
                 [(ngModel)]="minPrice"
                 (change)="onPriceChange()" />

          <input type="number"
                 [(ngModel)]="maxPrice"
                 (change)="onPriceChange()" />
        </div>

        <div class="range-wrapper">

          <input type="range"
                 min="0"
                 max="1000"
                 [(ngModel)]="minPrice"
                 (change)="onPriceChange()" />

          <input type="range"
                 min="0"
                 max="1000"
                 [(ngModel)]="maxPrice"
                 (change)="onPriceChange()" />
        </div>
      </div>
    </div>

  </div>
  <!--products cards-->
  <div class="products-area">
    <div class="products-container">
      <div *ngFor="let product of products">
        <div class="card" [routerLink]="['/product', product.id]">
          <div class="badge">HOT SALE</div>
          <div class="tilt">
            <div class="img"><img *ngIf="product.images?.length" [src]="product.images[0]" alt="{{product.name}}"></div>
          </div>
          <div class="info">
            <h2 class="title">{{product.name}}</h2>
            <div class="feats">
              <span class="feat">{{product.categoryName}}</span>
            </div>
            <div class="feats">
              <span class="feat">{{product.sellerName}}</span>
            </div>
            <div class="bottom">
              <div class="price">
                <span class="old">{{product.price | currency}}</span>
                <span class="new">{{product.price | currency}}</span>
              </div>
              <button class="btn">
                <span>Add to Cart</span>
                <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4" />
                  <line x1="3" y1="6" x2="21" y2="6" />
                  <path d="M16 10a4 4 0 01-8 0" />
                </svg>
              </button>
            </div>
            <div class="meta">
              <div class="rating">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFD700" stroke="#FFD700" stroke-width="0.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFD700" stroke="#FFD700" stroke-width="0.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFD700" stroke="#FFD700" stroke-width="0.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFD700" stroke="#FFD700" stroke-width="0.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFD700" stroke="#FFD700" stroke-width="0.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>
                <span class="rcount">245 Reviews</span>
              </div>
              <div class="stock">In Stock</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="load-more-container" *ngIf="hasMore">
      <button (click)="loadMore()" class="load-more-btn">
        Load More
      </button>
    </div>
  </div>
</div>
